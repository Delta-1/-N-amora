<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Amora · Conectar Drive</title><style>body{background:#17121f;color:#f3eafa;font:17px system-ui;display:grid;place-items:center;min-height:95vh;margin:0}main{max-width:400px;padding:30px}h1{color:#c3a2ff}a{display:block;background:#c3a2ff;color:#261a39;text-decoration:none;padding:18px;border-radius:20px;margin:18px 0;font-weight:700}p{line-height:1.6;color:#baabc9}</style><main><h1>Quase juntinhos ♡</h1><p id="message">Volte ao Amora para concluir a conexão do Google Drive.</p><a id="app">Continuar no aplicativo</a><a id="web">Continuar no navegador</a></main><script>const q=new URLSearchParams(location.search),code=q.get('code'),state=q.get('state');history.replaceState(null,'',location.pathname);const app=document.getElementById('app'),web=document.getElementById('web');if(code&&/^[a-f0-9]{64}$/.test(state||'')){app.href='amora://drive-callback?'+new URLSearchParams({code,state});web.href='./?'+new URLSearchParams({drive_code:code,drive_state:state});}else{document.getElementById('message').textContent='A autorização foi cancelada ou expirou. Abra o Amora e tente conectar novamente.';app.href='amora://open';web.href='./';}</script></html>
