<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voltar ao Amora</title><style>body{font:16px system-ui;background:#17121f;color:#f3eafa;text-align:center;padding:15vh 24px}a{display:inline-block;padding:16px 26px;background:#c7a6ef;color:#23182e;border-radius:15px;text-decoration:none}p{line-height:1.7}</style><h1>Seu cantinho está esperando ♡</h1><p>Conclua a entrada no aplicativo que iniciou o login.</p><a id="open" href="./">Voltar ao Amora</a><script>const q=new URLSearchParams(location.search),code=q.get('code');if(code&&code.length<4001){document.getElementById('open').href='amora://auth-callback?code='+encodeURIComponent(code);history.replaceState(null,'',location.pathname);}else document.querySelector('p').textContent='Não recebemos um código de autorização. Volte ao app e tente novamente.';</script></html>
