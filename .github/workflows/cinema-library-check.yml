name: Cinema and Library verification
on:
  push:
    branches: [cinema-library]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:pages && pnpm test:supabase && pnpm test:app
      - run: pnpm build:pages
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: mkdir -p android/app/src/main/assets/web && cp -a docs/. android/app/src/main/assets/web/ && gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Cinema-Library-build
          path: |
            docs/
            android/app/build/outputs/apk/debug/app-debug.apk
