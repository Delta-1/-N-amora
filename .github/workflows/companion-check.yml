name: Companion 4.2 verification
on:
  push:
    branches: [companion-upgrade]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build:pages
      - run: pnpm test:pages && pnpm test:supabase && pnpm test:app
      - run: node scripts/cinema-browser-smoke.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: amora-personal-debug-keystore-v1
      - run: mkdir -p android/app/src/main/assets/web && cp -a docs/. android/app/src/main/assets/web/ && gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-4.2-build
          path: |
            docs/
            android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save verified web bundle on an isolated build branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || git commit -m 'Build verified companion 4.2 web bundle'
          git push origin "HEAD:companion-build-$GITHUB_RUN_ID"
  android-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: Companion-4.2-build
          path: companion-artifact
      - run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install companion-artifact/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.amora.app/.MainActivity
            adb shell input keyevent 82
            python scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Companion-Android-test
          path: |
            android-smoke*.png
            android-smoke*.txt
            android-smoke*.xml
          if-no-files-found: ignore
